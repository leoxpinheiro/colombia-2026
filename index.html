<style>
/* Layout: app de uma coluna (máx. 760px), cartões arredondados sobre fundo areia-sálvia, barra de navegação flutuante em pílula. Caribe colombiano: verde-mar profundo, turquesa, amarelo da bandeira, coral. */
:root{
  --bg:#f1f4ef; --card:#ffffff; --soft:#e7eee8; --soft2:#dde8e1; --ink:#11302a; --muted:#647a72; --line:#dfe7e0;
  --pri:#0e5d55; --pri2:#14857a; --turq:#19b3ad; --sun:#f5c33b; --sun-bg:#fcf1cf; --sun-ink:#7d5b00;
  --coral:#e5634b; --coral-bg:#fbe4de; --ok:#1f8f63; --ok-bg:#dcf2e6; --info:#11766d; --info-bg:#dcf0ec;
  --dark:#0f3d38; --dark-ink:#eaf6f2;
  --shadow:0 1px 2px rgba(17,48,42,.05),0 8px 24px rgba(17,48,42,.07);
  --f-serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Plus Jakarta Sans","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:22px; --nav:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1513; --card:#13201d; --soft:#1a2a26; --soft2:#20332e; --ink:#e7f1ed; --muted:#93a9a1; --line:#23362f;
  --pri:#3cbfae; --pri2:#57d0c0; --turq:#38c9c2; --sun:#f2c94c; --sun-bg:#3a3118; --sun-ink:#f5d77c;
  --coral:#ff8a72; --coral-bg:#3a201b; --ok:#4fd29b; --ok-bg:#16352a; --info:#7fded1; --info-bg:#17352f;
  --dark:#0e2e2a; --dark-ink:#eaf6f2; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1513; --card:#13201d; --soft:#1a2a26; --soft2:#20332e; --ink:#e7f1ed; --muted:#93a9a1; --line:#23362f;
  --pri:#3cbfae; --pri2:#57d0c0; --turq:#38c9c2; --sun:#f2c94c; --sun-bg:#3a3118; --sun-ink:#f5d77c;
  --coral:#ff8a72; --coral-bg:#3a201b; --ok:#4fd29b; --ok-bg:#16352a; --info:#7fded1; --info-bg:#17352f;
  --dark:#0e2e2a; --dark-ink:#eaf6f2; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--turq);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(var(--nav) + 44px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.serif{font-family:var(--f-serif);font-weight:400;letter-spacing:-.01em}
h1.serif{font-size:34px;line-height:1.02}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16.5px;font-weight:800}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.see{font-size:13.5px;font-weight:700;color:var(--pri);background:none;border:0;padding:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}.ic.l{width:24px;height:24px}.ic.big{width:44px;height:44px;stroke-width:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:10px 14px;background:var(--soft);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff}
.btn.sun{background:var(--sun);color:#2b2100}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:12px}
.btn.icon{padding:9px;border-radius:50%}
.btn.danger{background:var(--coral-bg);color:var(--coral)}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--sun-bg);color:var(--sun-ink)}.pill.bad{background:var(--coral-bg);color:var(--coral)}.pill.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:12px;font-weight:800;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;margin-inline:-2px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:4px 0 14px}
.hi{font-weight:800;font-size:17px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.iconbtn .b{position:absolute;top:6px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--card);background:linear-gradient(135deg,var(--sun),var(--coral));color:#fff;font-weight:800;display:grid;place-items:center;box-shadow:var(--shadow)}
.avs{display:flex}.avs i{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);margin-left:-8px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:#fff}
.avs i:first-child{margin-left:0}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--ok)}.dot.off{background:var(--coral)}
/* hero */
.hero{position:relative;border-radius:30px;overflow:hidden;min-height:340px;color:#fff;background:#0f6f78;box-shadow:var(--shadow)}
.hero canvas,.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,32,.0) 30%,rgba(6,30,32,.62) 100%);pointer-events:none}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 46px;z-index:2;display:flex;flex-direction:column;gap:8px}
.hero h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(46px,13vw,66px);line-height:.92;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.hero h1 em{font-style:italic;color:var(--sun)}
.flagbar{display:flex;width:54px;height:6px;border-radius:3px;overflow:hidden}.flagbar i{flex:2;background:#fcd116}.flagbar i+i{flex:1;background:#003893}.flagbar i+i+i{background:#ce1126}
.cdown{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);padding:8px 14px 8px 8px;border-radius:99px;align-self:flex-start;font-weight:700;font-size:13.5px}
.cdown b{background:var(--sun);color:#2b2100;border-radius:99px;padding:4px 10px;font-size:15px}
.hero .credit{position:absolute;top:12px;right:14px;z-index:2;font-size:10px;opacity:.75}
.search{display:flex;align-items:center;gap:10px;width:100%;margin-top:-26px;position:relative;z-index:3;background:var(--card);border:0;border-radius:99px;padding:8px 8px 8px 18px;box-shadow:0 10px 30px rgba(17,48,42,.14);color:var(--muted);font-weight:600;text-align:left}
.search span{flex:1}
.search .go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.quick button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink)}
.quick button span.q{width:58px;height:58px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--pri)}
/* boarding pass */
.bp{border-radius:24px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.bp-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--pri);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.1em}
.bp-h .pill{background:rgba(255,255,255,.2);color:#fff;letter-spacing:0}
.bp-b{padding:16px}
.bp-r{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.bp-r small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bp-r b{display:block;font-size:34px;font-weight:800;letter-spacing:.01em;line-height:1.05}
.bp-r .t{font-weight:800;font-size:17px}
.bp-r .r{text-align:right}
.bp-mid{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:11.5px;font-weight:700;min-width:76px}
.bp-mid .ln{display:flex;align-items:center;gap:4px;color:var(--pri);width:100%}
.bp-mid .ln i{flex:1;border-top:2px dotted var(--soft2)}
.bp-f{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:end;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line);position:relative}
.bp-f::before,.bp-f::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.bp-f::before{left:-25px}.bp-f::after{right:-25px}
.bp-f small{display:block;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.bp-f span{font-weight:800;font-size:14px;overflow-wrap:anywhere}
.bp.pending .bp-h{background:var(--coral)}
.barcode{width:58px;height:40px;color:var(--ink)}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:4px}
.tile .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.donut{display:flex;align-items:center;gap:10px}
/* photo cards */
.pcard{position:relative;flex:none;width:172px;aspect-ratio:3/4;border-radius:24px;overflow:hidden;border:0;padding:0;color:#fff;text-align:left;background:var(--soft);box-shadow:var(--shadow)}
.pcard.wide{width:240px;aspect-ratio:4/3}
.pcard>img,.pcard>.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,25,24,.75));pointer-events:none}
.pcard .lab{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;gap:2px}
.pcard .lab b{font-size:17px;font-weight:800;line-height:1.15}
.pcard .lab span{font-size:12px;opacity:.9;font-weight:600}
.pcard .tag{position:absolute;top:10px;left:10px;z-index:2}
.pcard .arr{position:absolute;right:10px;bottom:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center}
.art{display:grid;place-items:center;color:rgba(255,255,255,.92);background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;position:relative}
.art::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 75% 20%,rgba(255,255,255,.35),transparent 35%),repeating-radial-gradient(circle at 10% 110%,rgba(255,255,255,.10) 0 2px,transparent 2px 16px)}
.art .ic{position:relative}
.city-art{display:flex;align-items:flex-end;padding:16px}
.city-art .nm{position:relative;font-family:var(--f-serif);font-size:30px;line-height:1}
/* dark card */
.darkc{background:var(--dark);color:var(--dark-ink);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.darkc .eyebrow{color:rgba(234,246,242,.7)}
.darkc .v{font-size:32px;font-weight:800;letter-spacing:-.02em}
.darkbar{height:9px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px}
.darkbar span{display:block;height:100%;border-radius:9px;background:var(--sun)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--pri2)}
.bar>span.over{background:var(--coral)}
/* list */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.badge{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--info-bg);color:var(--info)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.alert:first-child{border-top:0}
/* page head */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 0 14px}
.ph .sub{color:var(--muted);font-weight:600;font-size:13.5px;margin-top:4px}
/* day pills */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;margin-inline:-2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:60px;border:0;background:var(--card);border-radius:18px;padding:9px 8px;text-align:center;box-shadow:var(--shadow)}
.day small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.day i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--c,var(--line))}
.day[aria-pressed="true"]{background:var(--pri);color:#fff}
.day[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.dhero{position:relative;border-radius:26px;overflow:hidden;min-height:190px;color:#fff;margin-top:8px;box-shadow:var(--shadow)}
.dhero>img,.dhero>.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,25,24,.15),rgba(5,25,24,.72));pointer-events:none}
.dhero .in{position:relative;z-index:2;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:190px;gap:4px}
.dhero h2{font-family:var(--f-serif);font-weight:400;font-size:36px;line-height:1}
.dhero .rb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dhero .rb a{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.3)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats3>div{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stats3 small{display:block;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.stats3 b{font-size:16px;font-weight:800}
/* timeline */
.tlwrap{position:relative;margin-top:14px}

  return`<div class="rlink"><div class="between" style="align-items:flex-start"><div><span class="eyebrow">${ic("route","s")} Roteiro deste passeio</span><b>${esc(r.name)}</b><span class="small muted">${st.ps.length} paradas · ~${hTxt(Math.round(st.min/15)*15)} · ${durTag(st.min,r.start)}</span></div></div>
  <div class="rsteps">${st.ps.map((p,i)=>`<span class="rs"><i style="background:${PCAT[p.cat].c1}">${i+1}</i>${esc(p.name.replace(/ \(.*\)$/,""))}</span>`).join("")}</div>
  <div class="row" style="margin-top:10px"><button type="button" class="btn pri sm" data-a="route" data-v="${r.id}">${ic("map","s")} Ver roteiro e mapa</button><a class="btn sm" href="${gmRoute(st.ps.filter(p=>!p.boat),r.mode==="transit"?"transit":r.mode)}" target="_blank" rel="noopener">${ic("nav","s")} Abrir no Google Maps</a></div></div>`;}
const kfmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(".",",")+" mil":String(n);
function rankBadge(id,city){const r=RANK[id];if(!r)return"";return`<span class="rk ${r[0]<=3?"gold":r[0]<=10?"silver":""}">${r[0]<=10?"🏆 ":""}nº ${r[0]} em ${esc(city)}</span>`;}
function stars(id){const r=RANK[id];if(!r||!r[1])return"";return`<span class="stars">★ ${String(r[1]).replace(".",",")}<small> (${kfmt(r[2])})</small></span>`;}

const fmtBRL=v=>"R$ "+(Math.round(v*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brlR=v=>{const b=toBRL(v,"COP");return b<10?"R$ "+b.toFixed(2).replace(".",","):"R$ "+(b<100?Math.round(b):Math.round(b/5)*5).toLocaleString("pt-BR");};
function priceTxt(s){if(!s)return"";let t=String(s).trim();
  const T={"$":[0,30000],"$$":[30000,80000],"$$$":[80000,0]};
  const tier=k=>{const[a,b]=T[k];return a===0?`Barato: até ~COP 30 mil por pessoa (≈ até ${brlR(b)})`:b?`Médio: ~COP 30 a 80 mil por pessoa (≈ ${brlR(a)} a ${brlR(b)})`:`Caro: mais de COP 80 mil por pessoa (≈ ${brlR(a)} ou mais)`;};
  if(T[t])return tier(t);
  const cm=t.match(/^Consumação\s*(\${1,3})$/);if(cm)return"Consumação: "+tier(cm[1]).replace(/^\S+: /,"").replace(" por pessoa","");
  return t.replace(/COP\s*([\d.]+)(?:\s*[–-]\s*([\d.]+))?(\s*mil)?/g,(m,a,b,mil)=>{const n=x=>+x.replace(/\./g,"")*(mil?1000:1);return m+(b?` (≈ ${brlR(n(a))} a ${brlR(n(b))})`:` (≈ ${brlR(n(a))})`);});}
function priceShort(s){if(!s)return"";const t=String(s).trim();const m=priceTxt(t).match(/\(≈ ([^)]+)\)/);const cp=t.match(/COP\s*[\d.]+(?:\s*[–-]\s*[\d.]+)?(?:\s*mil)?/);
  if(m&&cp)return cp[0]+" · ≈ "+m[1];if(m)return t.replace(/\(.*$/,"").trim().slice(0,14)+" · ≈ "+m[1];return t.length>34?t.slice(0,32)+"…":t;}
const fmtCur=(v,c,raw)=>{v=+v||0;if(c==="COP")return"COP "+Math.round(v).toLocaleString("pt-BR")+(raw?"":` (≈ ${brlR(v)})`);if(c==="USD")return"US$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});return fmtBRL(v);};
const pd=d=>{const[y,m,dd]=d.split("-").map(Number);return new Date(Date.UTC(y,m-1,dd));};
const addDays=(d,n)=>{const x=pd(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dayList=()=>{const out=[];for(let d=TRIP.start;d<=TRIP.end;d=addDays(d,1))out.push(d);return out;};
const wd=d=>pd(d).getUTCDay();
const dShort=d=>d?`${d.slice(8)}/${d.slice(5,7)}`:"—";
const dLong=d=>{const m=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];return `${WDL[wd(d)]}, ${+d.slice(8)} de ${m[+d.slice(5,7)-1]}`;};
const tz=city=>(CITY[city]||{}).tz??-3;
const ts=(date,time,city)=>{if(!date)return NaN;const o=tz(city);const sign=o<0?"-":"+";return Date.parse(`${date}T${time||"00:00"}:00${sign}${String(Math.abs(o)).padStart(2,"0")}:00`);};
const hm=t=>t?t.replace(":","h"):"";
const addMin=(time,min)=>{if(!time)return"";let[h,m]=time.split(":").map(Number);let t=h*60+m+min;let day=0;while(t<0){t+=1440;day--;}while(t>=1440){t-=1440;day++;}return{t:`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`,day};};
const todayFor=()=>{const n=new Date(Date.now()-3*36e5);return n.toISOString().slice(0,10);};
const parseNum=v=>{let s=String(v||"").trim().replace(/\s/g,"");if(!s)return"";if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const n=+s;return isNaN(n)?"":n;};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const gmSearch=a=>a.lat!=null&&a.lat!==""?`https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((a.place||a.title||"")+" "+(a.city||""))}`;

const flightOrigin=f=>IATA[f.frm]||f.frm;const flightDest=f=>IATA[f.to]||f.to;
function eff(a){
  if(a.tourId&&S.tours[a.tourId]){const t=S.tours[a.tourId];return{date:t.date||a.date,time:t.time||a.time||"",auto:false};}
  if(a.flightId&&S.flights[a.flightId]){const f=S.flights[a.flightId];return{date:f.date||a.date,time:f.dep||a.time||"",auto:!!f.dep};}
  if(a.rel&&S.flights[a.rel.f]){const f=S.flights[a.rel.f];const base=a.rel.at==="arr"?f.arr:f.dep;const bd=a.rel.at==="arr"?(f.arrDate||f.date):f.date;
    if(base&&bd){const r=addMin(base,a.rel.min||0);return{date:addDays(bd,r.day),time:r.t,auto:true};}}
  return{date:a.date,time:a.time||"",auto:false};
}
function actsOfDay(d){return Object.entries(S.acts).map(([id,a])=>({id,...a,_e:eff(a)})).filter(a=>a._e.date===d).sort((x,y)=>(x.order||0)-(y.order||0));}
function flightsSorted(){return Object.entries(S.flights).map(([id,f])=>({id,...f})).sort((a,b)=>((a.date||"9")+(a.dep||"99")).localeCompare((b.date||"9")+(b.dep||"99"))||a.id.localeCompare(b.id));}
function conflicts(a,dayActs){
  if(["voo","transporte","hotel"].includes(a.kind)||!a._e.time)return null;
  for(const f of flightsSorted()){
    if(f.date===a._e.date&&f.dep&&flightOrigin(f)===a.city){const lim=addMin(f.dep,-150);if(lim.day===0&&a._e.time>lim.t)return`Conflita com o voo ${f.frm} → ${f.to} das ${hm(f.dep)}`;}
    const ad=f.arrDate||f.date;if(ad===a._e.date&&f.arr&&flightDest(f)===a.city&&a._e.time<f.arr&&a._e.time>"04:00"&&f.date===ad)return`Antes da chegada do voo ${f.frm} → ${f.to} (${hm(f.arr)})`;
  }
  return null;
}
const cityOfDay=d=>{const as=actsOfDay(d).filter(a=>a.kind!=="voo");const counts={};as.forEach(a=>{if(a.city)counts[a.city]=(counts[a.city]||0)+1;});let best=null,n=0;for(const[c,k]of Object.entries(counts))if(k>n){best=c;n=k;}return best||"Fortaleza";};
function nights(h){return h.checkin&&h.checkout?Math.max(0,daysBetween(h.checkin,h.checkout)):0;}

function groupSplit(){const s=settings().group;if(s&&s.date&&Array.isArray(s.people)&&s.people.length)return s;const p=people();if(p.includes("Leo")&&p.includes("Inês")&&p.length>2)return{date:"2026-11-23",people:["Leo","Inês"]};return null;}

const recDate=x=>x.date||x.checkin||"";
function splitOf(x){const p=people();const s=(x.split||[]).filter(n=>p.includes(n));return s.length?s:travelersOn(recDate(x));}
function lines(){
  const L=[];

  Object.entries(S.flights).forEach(([id,f])=>{if(+f.price)L.push({src:"flights",id,desc:`Voo ${f.frm} → ${f.to}`,cat:"Passagens",date:f.date,amount:+f.price,cur:f.cur||"BRL",perPerson:!!f.perPerson,payer:f.payer,split:splitOf(f),pay:f.pay||"pendente",method:f.method,inst:f.inst,pts:f.pts});});
  Object.entries(S.hotels).forEach(([id,h])=>{if(+h.price)L.push({src:"hotels",id,desc:`Hospedagem ${h.city}${h.name&&h.name!=="A definir"?" · "+h.name:""}`,cat:"Hospedagem",date:h.checkin,amount:+h.price,cur:h.cur||"BRL",perPerson:!!h.perPerson,payer:h.payer,split:splitOf(h),pay:h.pay||"pendente",method:h.method,inst:h.inst});});
  Object.entries(S.tours).forEach(([id,t])=>{if(+t.price)L.push({src:"tours",id,desc:t.title,cat:"Passeios",date:t.date,amount:+t.price,cur:t.cur||"BRL",perPerson:!!t.perPerson,payer:t.payer,split:splitOf(t),pay:t.pay||"pendente",method:t.method,inst:t.inst});});
  L.forEach(l=>{l.total=l.perPerson?l.amount*l.split.length:l.amount;l.brl=toBRL(l.total,l.cur);});
  return L.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
function finance(){
  const L=lines();const p=people();const per={};p.forEach(n=>per[n]={share:0,paid:0,shareAll:0,kit:0});
  let total=0,paid=0,pend=0,prev=0;const byCat={};CATS.forEach(c=>byCat[c]=0);
  L.forEach(l=>{total+=l.brl;if(l.pay==="pago")paid+=l.brl;else if(l.pay==="previsto")prev+=l.brl;else pend+=l.brl;byCat[l.cat]=(byCat[l.cat]||0)+l.brl;
    const sh=l.brl/(l.split.length||1);l.split.forEach(n=>{if(per[n]){per[n].shareAll+=sh;if(l.pay==="pago")per[n].share+=sh;}});
    if(l.pay==="pago"&&l.payer&&per[l.payer])per[l.payer].paid+=l.brl;});
  const kl=(metaDoc("kitty").list||[]);let kin_=0;kl.forEach(k=>{const b=toBRL(+k.amount||0,k.cur||"COP");kin_+=b;if(per[k.who]){per[k.who].paid+=b;per[k.who].kit+=b;}});const kout_=L.filter(l=>l.payer==="Caixinha"&&l.pay==="pago").reduce((a,l)=>a+l.brl,0);
  const noPayer=L.filter(l=>l.pay==="pago"&&!(l.payer&&(per[l.payer]||l.payer==="Caixinha")));
  const bal=p.map(n=>({n,v:per[n].paid-per[n].share}));if(kin_>0.5)bal.push({n:"Caixinha",v:-(kin_-kout_)});const deb=bal.filter(b=>b.v<-0.5).map(b=>({...b,v:-b.v})).sort((a,b)=>b.v-a.v);const cre=bal.filter(b=>b.v>0.5).sort((a,b)=>b.v-a.v);
  const settle=[];let i=0,j=0;while(i<deb.length&&j<cre.length){const m=Math.min(deb[i].v,cre[j].v);settle.push({from:deb[i].n,to:cre[j].n,v:m});deb[i].v-=m;cre[j].v-=m;if(deb[i].v<.5)i++;if(cre[j].v<.5)j++;}
  const budget=settings().budget||{};const btotal=Object.values(budget).reduce((a,b)=>a+(+b||0),0);
  return{L,total,paid,pend,prev,per,byCat,settle,budget,btotal,noPayer};
}

const PERL={m:"Manhã",t:"Tarde",n:"Noite",d:"Dia todo"};
const t2m=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m;};
function dayBusy(d){const o={m:[],t:[],n:[]};actsOfDay(d).forEach(a=>{const t=a._e.time;if(!t||a.kind==="hotel")return;o[perOf(t)].push(a.title);});flightsSorted().filter(f=>f.date===d&&f.dep).forEach(f=>o[perOf(f.dep)].push("Voo "+f.frm+"→"+f.to));return o;}
function recPer(min,start){return min>330?"d":start&&start<"12:00"?"m":start&&start>="17:00"?"n":"t";}
function perStart(per,start){if(per==="d")return start&&start<"11:00"?start:"08:30";if(per==="m")return start&&start<"12:00"?start:"09:00";if(per==="n")return start&&start>="17:00"?start:"19:00";return start&&start>="12:00"&&start<"17:00"?start:"14:00";}
function perChips(d,sel,rec,opts){const b=dayBusy(d);const keys=opts||["m","t","n","d"];return keys.map(k=>{const items=k==="d"?[...b.m,...b.t]:b[k];const st=items.length?`tem ${items.length}`:"livre";return`<button type="button" class="perc ${items.length?"busy":"free"}" data-a="pickPer" data-v="${k}" aria-pressed="${k===sel}">${k===rec?'<i class="perrec">ideal</i>':""}<b>${PERL[k]}</b><small>${items.length&&items[0].startsWith("Voo")?"voo":st}</small></button>`;}).join("");}
function conflictsIn(d,t0,t1,skip){return actsOfDay(d).filter(a=>{const t=t2m(a._e.time);if(t==null||a.kind==="hotel"||a.kind==="voo"||(skip&&skip.includes(a.id)))return false;const e=t+(+a.dur||60);return t<t1&&e>t0;});}

const MCITIES=["San Andrés","Cartagena","Medellín","Bogotá","Belém"];
const DAYC=["#e5634b","#14857a","#5b5fc7","#c28a00","#b44f8a","#0b7fab"];

function cityAllMap(city){const C=CITY[city];const near=p=>hav(p,C)<70;

function tripMap(){

async function addPlace(id){const p=PLACE[id];const d=$("#apDay").value,t=$("#apTime").value;const ord=insertOrder(d,t);closeForm();const stay=ui.tab==="roteiro"&&ui.rview==="plan";ui.tab="roteiro";if(!stay)ui.rview="dia";ui.day=d;persistUI();await write("acts",uid("a"),actFromPlace(p,d,t,ord));toast(`${p.name} adicionado em ${dShort(d)}`);}
async function addRoute(id){const r=ROUTES.find(x=>x.id===id);const d=$("#arDay").value;let t=$("#arTime").value||r.start;const ps=routeStats(r).ps;closeForm();ui.tab="roteiro";ui.rview="dia";ui.day=d;persistUI();
  for(let i=0;i<ps.length;i++){const p=ps[i];const ord=insertOrder(d,t);await write("acts",uid("a"),actFromPlace(p,d,t,ord));const next=ps[i+1];if(next){const km=hav(p,next);const m=r.mode==="walking"?walkMin(km):r.mode==="boat"?20:carMin(km);const x=addMin(t,Math.round((sdur(p)+m)/5)*5);t=x.day?"23:55":x.t;}}
  toast(`${ps.length} paradas adicionadas em ${dShort(d)}`);}
async function toggleFav(id){const list=[...(metaDoc("favs").list||[])];const i=list.indexOf(id);if(i>=0)list.splice(i,1);else list.push(id);await write("meta","favs",{list});openPlace(id);}
function dayRouteURL(d,mode){const all=daySegment(d).filter(p=>!p.done).map(p=>({lat:+p.lat,lng:+p.lng}));const clean=all.filter((p,i)=>!i||Math.abs(p.lat-all[i-1].lat)+Math.abs(p.lng-all[i-1].lng)>0.0003);return clean.length>1?gmRoute(clean,mode):"";}
function nearHotel(x){if(!hasLoc(x))return"";const ps=PLACES.filter(p=>p.city===x.city&&!p.buy&&!p.boat).map(p=>({p,km:hav({lat:+x.lat,lng:+x.lng},p)})).filter(o=>o.km<15).sort((a,b)=>a.km-b.km).slice(0,6);if(!ps.length)return"";
  return`<details class="near"><summary>${ic("compass","s")} O que tem perto${x.address?"":" (posição aproximada)"}</summary>${ps.map(({p,km})=>`<button type="button" class="nrow" data-a="place" data-v="${p.id}"><div class="thumb" style="width:46px;height:46px;border-radius:12px">${img(photoOf(p.id),p.name,art(p.cat))}</div><span style="flex:1;min-width:0;text-align:left"><b>${esc(p.name)}</b><span class="small muted" style="display:block">${PCAT[p.cat].l}</span></span><span class="small num" style="text-align:right">${kmTxt(km)}<br><span class="muted">${km<2.5?walkMin(km)+" min a pé":"~"+carMin(km)+" min"}</span></span></button>`).join("")}</details>`;}

function updScale(m){const w=m.parentNode&&m.parentNode.querySelector(".mscale");const c=m.querySelector(".canvas");if(!w||!c||!c.clientWidth)return;const mpp=+w.dataset.mppw/c.clientWidth;

function fitMap(m){const c=m.querySelector(".canvas");const z0=+m.dataset.z0||+m.dataset.zoom||1;m.dataset.z0=z0;m.dataset.zoom=z0;c.style.width=z0*100+"%";requestAnimationFrame(()=>{updScale(m);m.scrollLeft=c.clientWidth*+m.dataset.cx-m.clientWidth/2;m.scrollTop=c.clientHeight*+m.dataset.cy-m.clientHeight/2;});}

function zoomMap(id,f){const m=document.getElementById(id);if(!m)return;const c=m.querySelector(".canvas");const z=Math.min(6,Math.max(1,(+m.dataset.zoom||1)*f));const cx=(m.scrollLeft+m.clientWidth/2)/c.clientWidth,cy=(m.scrollTop+m.clientHeight/2)/c.clientHeight;m.dataset.zoom=z;c.style.width=z*100+"%";requestAnimationFrame(()=>{updScale(m);m.scrollLeft=c.clientWidth*cx-m.clientWidth/2;m.scrollTop=c.clientHeight*cy-m.clientHeight/2;});}

function blockOfAct(aid){const a=S.acts[aid];if(!a)return null;const d=eff(a).date;for(const[tid,t]of Object.entries(S.tours))if(t.date===d&&tourBlock(tid).includes(aid))return tid;return null;}
function toursOn(d,city,except){return Object.entries(S.tours).filter(([id,t])=>t.date===d&&id!==except&&(!city||t.city===city)).map(([id,t])=>({id,...t}));}
let sw=null;

function renderSwap(){const t=S.tours[sw.tid];const city=t.city;const days=(city==="Bogotá"?["2026-11-27"]:stayDays(city)).filter(d=>d!==t.date);const A=tourBlock(sw.tid);

    const clash=(ids,day,leaving)=>{const w=win(ids);if(!w)return[];return actsOfDay(day).filter(a=>!leaving.includes(a.id)&&!["voo","hotel"].includes(a.kind)&&!a.flightId).filter(a=>{const t=t2m(a._e.time);return t!=null&&t>w[0]&&t<w[1];}).map(a=>hm(a._e.time)+" "+a.title);};

async function swapTours(tid,target,mode,off){const t=S.tours[tid];if(!t||!t.date||!target)return;const from=t.date;off=off||new Set();

function slotKey(min){return min<11.5*60?"m":min<16.5*60?"t":min<18.75*60?"s":"n";}
function whenTags(p){const w=(p.when||"").toLowerCase();const t=new Set();const hh=w.match(/(\d{1,2})h/);if(/depois das 2\dh/.test(w))t.add("n");else if(hh){t.add(slotKey(+hh[1]*60));}
  if(/manhã|cedo/.test(w))t.add("m");if(/fim de tarde|pôr do sol|entardecer/.test(w))t.add("s");if(/tarde/.test(w.replace(/fim de tarde/g,"")))t.add("t");if(/noite/.test(w))t.add("n");if(/horário quente/.test(w)){t.add("t");}
  if(/dia inteiro|meio período/.test(w))t.add("full");if(/almoço/.test(w))t.add("t");if(/jantar/.test(w))t.add("n");if(!t.size&&p.cat==="noite")t.add("n");return t;}
const MUSEUM=/museo|museu|palacio|palácio|igreja|catedral|inquisi|convento|biblioteca|mercado/i;
function timeFit(p,min){const w=(p.when||"").toLowerCase();const k=slotKey(min);
  if((p.cat==="noite")&&min<17*60)return-9;
  if(MUSEUM.test(p.name)&&min>=17*60)return-9;
  const hh=w.match(/(\d{1,2})h(\d{2})?/);if(hh){const hm_=+hh[1]*60+(+hh[2]||0);if(/depois/.test(w))return min>=hm_-30?3:-9;if(Math.abs(min-hm_)<=75)return 3;if(!/manhã|tarde|noite/.test(w))return-9;}
  const tg=whenTags(p);if(!tg.size)return p.cat==="noite"?(k==="n"?2:-9):1;if(tg.has(k))return 3;if(tg.has("full"))return-9;
  if((k==="m"&&tg.has("t"))||(k==="t"&&tg.has("m")&&!MUSEUM.test(p.name)))return 1;
  if(k==="s"&&tg.has("n")&&p.cat!=="noite")return 1;if(k==="n"&&tg.has("s"))return 1;
  if(k==="s"&&tg.has("t")&&!MUSEUM.test(p.name)&&["praia","mirante","compras","natureza"].includes(p.cat))return 1;
  return-9;}

  const after=as.find(x=>hasLoc(x)&&x._e.time&&t2m(x._e.time)>min);const nextT=as.map(x=>t2m(x._e.time)).filter(x=>x!=null&&x>min).sort((p,q)=>p-q)[0];const gap=nextT!=null?nextT-min:300;
  const used=new Set(Object.values(S.acts).map(x=>x.placeId).filter(Boolean));
  const base=PLACES.filter(p=>p.city===city&&!used.has(p.id)&&p.cat!=="comida"&&!p.boat&&!(p.buy&&p.dur>150));
  const rows=base.map(p=>{const tf=timeFit(p,min);const d1=before&&hasLoc(before)?hav(before,p):0,d2=after?hav(p,after):0;const det=d1+d2-(before&&after&&hasLoc(before)?hav(before,after):0);const fits=p.dur<=gap+20;const r=RANK[p.id];

  return{list:ok.sort((x,y)=>y.score-x.score).slice(0,8),slot:slotKey(min),gap,before,after};}

/* ===== CONFERIR GASTOS ===== */
const normW=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3&&!["pessoa","veiculo","aluguel","passeio","entrada","taxa","valor","estimativa","viagem","para","com"].includes(w));
function auditGastos(){const A=[];const F=finance();const L=F.L;
  F.noPayer.forEach(l=>A.push({lvl:"bad",src:l.src,id:l.id,t:`${l.desc}`,s:"Está como pago, mas falta dizer quem pagou. Sem isso o acerto entre vocês não fecha."}));
  Object.entries(S.hotels).forEach(([id,h])=>{if(!(+h.price))A.push({lvl:"mid",src:"hotels",id,t:`Hospedagem · ${hName(h)}`,s:"Sem valor. Coloque quanto custou e quem pagou."});});
  Object.entries(S.flights).forEach(([id,f])=>{if(!(+f.price)&&!(+f.pts))A.push({lvl:"mid",src:"flights",id,t:`Voo ${f.frm} → ${f.to}`,s:"Sem valor nem pontos."});});
  Object.entries(S.tours).forEach(([id,t])=>{if(!(+t.price)&&t.status!=="cancelado")A.push({lvl:"mid",src:"tours",id,t:`Passeio · ${t.title}`,s:"Sem valor."});});
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];if(a.src===b.src&&a.id===b.id)continue;if(Math.abs(daysBetween(a.date||TRIP.start,b.date||TRIP.start))>1)continue;const wa=normW(a.desc),wb=normW(b.desc);const com=wa.filter(w=>wb.includes(w));if(com.length)A.push({lvl:"bad",src:b.src,id:b.id,t:`Parece repetido: ${a.desc} e ${b.desc}`,s:`${dShort(a.date)} · ${fmtBRL(a.brl)} e ${fmtBRL(b.brl)}. Se for a mesma coisa, apague um.`,dup:{src:a.src,id:a.id}});}
  L.filter(l=>l.perPerson&&l.split.length>1&&l.pay==="pago"&&!((S[l.src]||{})[l.id]||{}).conferido).forEach(l=>A.push({lvl:"info",src:l.src,id:l.id,t:`${l.desc}: ${fmtCur(l.amount,l.cur,1)} por pessoa × ${l.split.length} = ${fmtBRL(l.brl)}`,s:`Confira: ${fmtCur(l.amount,l.cur,1)} é o valor de cada pessoa${l.inst?` (não a parcela de ${l.inst}x)`:""}? Se for o total, desmarque "por pessoa".`}));
  return A;}
function auditCard(){const A=auditGastos();if(!A.length)return`<div class="card audit ok">${ic("check","s")} <b>Tudo conferido.</b> Nenhum valor faltando ou repetido.</div>`;
  const C={bad:["var(--coral-bg)","var(--coral)","alert"],mid:["var(--sun-bg)","var(--sun-ink)","info"],info:["var(--info-bg)","var(--info)","info"]};

/* ===== LOCALIZAÇÃO: buscar endereço e marcar no mapa ===== */
function mapForCity(city){const c=CITY[city];if(!c)return null;const k={"San Andrés":"sa",Cartagena:"ct",Medellín:"md",Bogotá:"bo",Belém:"be",Guatapé:"gu"}[city];return k&&MAPS[k]?MAPS[k]:null;}
function unproj(M,fx,fy){const n=256*2**M.z;const wx=M.x0+fx*M.w,wy=M.y0+fy*M.h;const lng=wx/n*360-180;const lat=Math.atan(Math.sinh(Math.PI*(1-2*wy/n)))*180/Math.PI;return{lat:+lat.toFixed(6),lng:+lng.toFixed(6)};}
function formVal(n){const f=$("#sheetForm");const e=f&&f.querySelector(`[name="${n}"]`);return e?e.value:"";}
function setCoordsInput(lat,lng){const f=$("#sheetForm");const e=f&&f.querySelector('[name="coords"]');if(e){e.value=`${lat}, ${lng}`;e.dispatchEvent(new Event("input",{bubbles:true}));const n=f.querySelector(".coordok");if(n)n.innerHTML=`${ic("check","s")} Localização marcada`;}}
async function geoSearch(){const addr=(formVal("address")||formVal("place")||"").trim();const city=formVal("city");if(!addr){toast("Escreva o endereço primeiro");return;}
  const qs=[addr+(city&&!addr.includes(city)?", "+city:""),addr.replace(/apt?o?\.?\s*\d+|apartamento|apto\s*\d+|edificio\s+\w+/gi,"")+", "+city];toast("Procurando o endereço…");
  for(const q of qs){try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=pt&q="+encodeURIComponent(q));const j=await r.json();if(j&&j[0]){setCoordsInput(+(+j[0].lat).toFixed(6),+(+j[0].lon).toFixed(6));toast("Achei: "+String(j[0].display_name).split(",").slice(0,3).join(","));return;}}catch(e){toast("A busca não funciona aqui. Use “Marcar no mapa” ou cole o link do Google Maps.");return;}}
  toast("Não achei esse endereço. Use “Marcar no mapa”.");}
function mapPick(){const city=formVal("city")||ui.city;const M=mapForCity(city);if(!M){toast("Sem mapa para "+city+". Cole o link do Google Maps.");return;}
  const cur=(formVal("coords").match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/)||[]);const start=cur[1]?{lat:+cur[1],lng:+cur[2]}:CITY[city];
  const o=document.createElement("div");o.className="mpick";o.innerHTML=`<div class="mp-top"><b>Toque onde fica</b><span>${esc(city)} · arraste para mover</span><button type="button" class="mp-x" aria-label="Fechar">${ic("x")}</button></div><div class="mp-sc"><div class="mp-c"><img src="${M.src}" alt=""><span class="mp-pin" hidden>${ic("pin")}</span></div></div><div class="mp-bot"><button type="button" class="btn ghost mp-z" data-z="-1">−</button><button type="button" class="btn ghost mp-z" data-z="1">+</button><button type="button" class="btn pri mp-ok" disabled>Usar este ponto</button></div>`;
  document.body.appendChild(o);const sc=o.querySelector(".mp-sc"),c=o.querySelector(".mp-c"),pin=o.querySelector(".mp-pin"),ok=o.querySelector(".mp-ok");let z=2.2,sel=null;
  const W=()=>Math.round(sc.clientWidth*z);const place=()=>{c.style.width=W()+"px";if(sel){const[fx,fy]=mproj(M,sel);pin.hidden=false;pin.style.left=fx*100+"%";pin.style.top=fy*100+"%";}};
  const center=p=>{const[fx,fy]=mproj(M,p);sc.scrollLeft=fx*c.clientWidth-sc.clientWidth/2;sc.scrollTop=fy*c.clientHeight-sc.clientHeight/2;};
  if(cur[1])sel={lat:+cur[1],lng:+cur[2]};place();requestAnimationFrame(()=>center(start));
  c.addEventListener("click",e=>{const r=c.getBoundingClientRect();sel=unproj(M,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);ok.disabled=false;place();});
  o.querySelectorAll(".mp-z").forEach(b=>b.addEventListener("click",()=>{const mid=unproj(M,(sc.scrollLeft+sc.clientWidth/2)/c.clientWidth,(sc.scrollTop+sc.clientHeight/2)/c.clientHeight);z=Math.max(1,Math.min(6,z*(+b.dataset.z>0?1.5:1/1.5)));place();center(mid);}));
  o.querySelector(".mp-x").addEventListener("click",()=>o.remove());ok.addEventListener("click",()=>{if(sel)setCoordsInput(sel.lat,sel.lng);o.remove();toast("Localização marcada");});}

function flightMiss(f){return[!f.number&&"nº do voo",!f.pnr&&"localizador",!(f.dep&&f.arr)&&"horários",!(+f.price||+f.pts)&&"valor ou pontos",+f.price&&!f.payer&&"quem pagou"].filter(Boolean);}
function tourMiss(t){return[!t.time&&"horário",!t.operator&&"empresa",!t.meet&&"ponto de encontro",!t.contact&&"contato",!(+t.price)&&"valor",+t.price&&t.pay!=="pago"&&"pagamento",+t.price&&t.pay==="pago"&&!t.payer&&"quem pagou"].filter(Boolean);}
function prepStats(){const H=Object.entries(S.hotels).filter(([,h])=>h.status!=="cancelado"),F=Object.entries(S.flights),T=Object.entries(S.tours).filter(([,t])=>t.status!=="cancelado");

function readForm(){

    const el=f.querySelector(`[name="${k}"]`);if(!el)continue;
    if(t==="check"){d[k]=el.checked;continue;}
    if(t==="coords"){const v=el.value;const m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||v.match(/(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/);if(!m&&/goo\.gl|maps\.app/.test(v)){toast("Link curto não traz a posição: no Maps, toque e segure no local e copie os números");}if(m){d.lat=+m[1];d.lng=+m[2];}else if(!el.value.trim()){delete d.lat;delete d.lng;}continue;}
    if(t==="number"){d[k]=parseNum(el.value);continue;}
    let v=el.value;if(k==="frm"||k==="to")v=v.trim().toUpperCase();d[k]=v;
  }
  return d;
}

/* ---------- conexão ---------- */
let snapAt="",encBlob=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  if(!encBlob){const r=await fetch("data-full.json",{cache:"no-store"});if(!r.ok)throw new Error("sem dados");encBlob=await r.json();}
  const enc=new TextEncoder();const base=await crypto.subtle.importKey("raw",enc.encode(pass.trim().toUpperCase()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(encBlob.salt),iterations:encBlob.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(encBlob.iv)},key,b64(encBlob.ct));
  const d=JSON.parse(new TextDecoder().decode(pt));COLS.forEach(k=>{S[k]=d[k]||{};});snapAt=d._at||"";conn="snapshot";
  try{localStorage.setItem("nv26-pass",pass.trim().toUpperCase());}catch(e){}render();return true;}
async function loadSnapshot(){let saved="";try{saved=localStorage.getItem("nv26-pass")||"";}catch(e){}
  if(saved){try{await unlock(saved);return;}catch(e){try{localStorage.removeItem("nv26-pass");}catch(_){}}}
  conn="locked";render();}
render();
(async()=>{
  const use=window.claude&&window.claude.use;
  if(use){try{db=await window.claude.use("db");}catch(e){db=null;}}
  if(!db){await loadSnapshot();if(!use)return;}
  else{COLS.forEach(col=>{db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S[col]=o;loaded.add(col);if(loaded.size===COLS.length){conn="live";setTimeout(()=>ensureHotelActs(),1500);}saveCache();if(!form)render();},err=>{conn="off";render();});});}
  try{assets=await window.claude.use("assets");}catch(e){assets=null;}
  try{downloads=await window.claude.use("downloads");}catch(e){downloads=null;}
  render();
})();
